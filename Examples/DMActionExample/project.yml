# The example app of DMAction. The Xcode project next to this file is generated from it:
# change this file and run `xcodegen` here, never edit the project by hand.
name: DMActionExample
options:
  bundleIdPrefix: io.github.nikolaydementiev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  DMAction:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The types of the app are declared `package`, so a test bundle reaches them with a plain import.
    OTHER_SWIFT_FLAGS: "-package-name DMActionExample -enable-upcoming-feature ExistentialAny"
targets:
  DMActionExample:
    type: application
    platform: iOS
    sources:
      - DMActionExample
    dependencies:
      - package: DMAction
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  DMActionExample:
    build:
      targets:
        DMActionExample: all
