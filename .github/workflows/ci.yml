name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs all of it on a version tag.
  workflow_call:
  schedule:
    # Mondays. A new runner image or OS that breaks the package shows up within a week.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request supersedes its older run. Runs on main are never
  # cancelled: a merge, the weekly run and a manual run each keep their own record.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Lint
        run: Scripts/lint.sh
      # A rule that never matches reports nothing, so the fixtures prove that each one fires.
      - name: Check that the lint rules fire
        run: Scripts/check-lint-contract.sh
      # Two runs at once on one checkout must not break each other while the tool is fetched.
      - name: Check that the lint tool is fetched safely
        run: Scripts/check-lint-tool.sh
      # The scripts that forward to devkit are code that nothing else tests: one that dropped its
      # arguments or its status would pass every other check.
      - name: Check that the wrappers forward to devkit
        run: Scripts/check-wrappers.sh
      # The analyzer rules, unused_import among them, read the compiler invocations of a full build.
      - name: Build the library for the analyzer
        run: |
          xcodebuild build \
            -scheme DMAction \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            > "$RUNNER_TEMP/build.log" 2>&1 \
            || { tail -50 "$RUNNER_TEMP/build.log"; exit 1; }
      - name: Run the analyzer rules
        run: Scripts/lint.sh --analyze "$RUNNER_TEMP/build.log"

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The newest hosted image, Xcode and iOS runtime.
          - name: iOS 26.5
            runner: macos-26
            xcode: "26.6"
            device: iPhone 17
            os: "26.5"
          # The oldest hosted image and the oldest iOS runtime it offers.
          - name: iOS 18.5
            runner: macos-15
            xcode: "16.4"
            device: iPhone 16
            os: "18.5"
    env:
      XCODE: ${{ matrix.xcode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
      # The udid names the device, not a name and an OS: a hosted image can list a runtime with
      # no device in it, and the script creates the device then.
      - name: Prepare the simulator
        env:
          DEVICE: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: |
          udid="$(Scripts/prepare-simulator.sh "$DEVICE" "$OS")"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      # The tests build in Debug. Code that only a Release build compiles is built here.
      - name: Build the library in Release
        run: |
          xcodebuild build \
            -scheme DMAction \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Test
        run: |
          xcodebuild test \
            -scheme DMAction \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RUNNER_TEMP/DMAction.xcresult" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Coverage
        run: Scripts/coverage-gate.sh "$RUNNER_TEMP/DMAction.xcresult"
      - name: Export library coverage
        run: Scripts/export-coverage.sh "$RUNNER_TEMP/DMAction.xcresult" DMAction "$RUNNER_TEMP/coverage.lcov"
      - name: Upload coverage to Codecov
        # Forks and Dependabot cannot request the OIDC credentials used for this upload.
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        # Codecov is a report, not a gate: an outage or a failed token request must not fail the job.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/coverage.lcov
          disable_search: true
          plugins: noop
          disable_file_fixes: true
          fail_ci_if_error: false
          name: library-${{ matrix.name }}
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult-${{ matrix.runner }}
          path: ${{ runner.temp }}/DMAction.xcresult
          retention-days: 7

  # The package's own tests on a watchOS simulator, and the library built for the device SDK.
  # The podspec job builds the library's sources for watchOS, but no test file and no run.
  watchos:
    name: watchos (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The newest hosted image, Xcode and watchOS runtime.
          - name: watchOS 26.5
            runner: macos-26
            xcode: "26.6"
            device: Apple Watch Series 11 (46mm)
            os: "26.5"
          # The oldest hosted image and the oldest watchOS runtime it offers.
          - name: watchOS 11.5
            runner: macos-15
            xcode: "16.4"
            device: Apple Watch Series 10 (46mm)
            os: "11.5"
    env:
      XCODE: ${{ matrix.xcode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
      - name: Prepare the simulator
        env:
          DEVICE: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: |
          udid="$(Scripts/prepare-simulator.sh "$DEVICE" "$OS" watchOS)"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      # The tests build the simulator slices. Only this step builds the device slices, which
      # include arm64_32, where Int and pointers are 32 bits wide.
      - name: Build the library for the watchOS device SDK
        run: |
          xcodebuild build \
            -scheme DMAction \
            -sdk watchos \
            -destination 'generic/platform=watchOS' \
            -configuration Release \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      - name: Build the consumer fixture for the watchOS Simulator
        working-directory: Fixtures/Consumer
        run: |
          xcodebuild build \
            -scheme Consumer \
            -destination 'generic/platform=watchOS Simulator'
      - name: Test
        run: |
          xcodebuild test \
            -scheme DMAction \
            -destination "platform=watchOS Simulator,id=$SIMULATOR" \
            -resultBundlePath "$RUNNER_TEMP/DMAction-watchOS.xcresult" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
      # A run that lost tests, or skipped them, passes too. So every test method of the test
      # files must be in the result bundle, run and passed.
      - name: Check the test count
        run: Scripts/count-tests.sh --label watchOS "$RUNNER_TEMP/DMAction-watchOS.xcresult" 'Tests/DMActionTests/*.swift'
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult-watchos-${{ matrix.runner }}
          path: ${{ runner.temp }}/DMAction-watchOS.xcresult
          retention-days: 7

  example:
    name: example (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 26.5
            runner: macos-26
            xcode: "26.6"
            device: iPhone 17
            os: "26.5"
            newest: true
          - name: iOS 18.5
            runner: macos-15
            xcode: "16.4"
            device: iPhone 16
            os: "18.5"
            newest: false
    env:
      XCODE: ${{ matrix.xcode }}
    defaults:
      run:
        working-directory: example-checkout
    steps:
      # A folder that is not named after the repository: the example must build from any.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: example-checkout
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
      # The first launch on a simulator that is still booting can fail to install the test
      # runner, so the simulator is booted and ready before the tests start.
      - name: Prepare the simulator
        env:
          DEVICE: ${{ matrix.device }}
          OS: ${{ matrix.os }}
        run: |
          udid="$(Scripts/prepare-simulator.sh "$DEVICE" "$OS")"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - name: Build the example and run its tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Examples/DMActionExample/DMActionExample.xcodeproj \
            -scheme DMActionExample \
            -destination "platform=iOS Simulator,id=$SIMULATOR" \
            -resultBundlePath "$RUNNER_TEMP/example.xcresult" \
            2>&1 | tee "$RUNNER_TEMP/example.log"
      # A scheme that lost a test bundle would still build and pass.
      - name: Check that both test bundles ran
        run: |
          for bundle in DMActionExampleTests DMActionExampleUITests; do
            if ! grep -q "Test Suite '$bundle.xctest' passed" "$RUNNER_TEMP/example.log"; then
              echo "The test bundle $bundle did not run."
              exit 1
            fi
          done
      # A bundle whose tests were skipped, or that lost tests, passes too. So every test method of
      # the example's test files must be in the result bundle, run and passed.
      - name: Check the test counts
        run: Scripts/count-tests.sh --label example "$RUNNER_TEMP/example.xcresult" 'Examples/DMActionExample/*Tests/*.swift'
      # Xcode compiles the package with its warnings suppressed, so warnings as errors cannot
      # cover the whole build. The library's own warnings fail the test job; this step covers
      # the sources of the example.
      - name: Fail on a warning in the example
        run: |
          # No warning means something only if the log shows every source of the example compiled.
          missing=""
          while IFS= read -r source; do
            if ! grep -qE "^SwiftCompile .*/$source( |$)" "$RUNNER_TEMP/example.log"; then
              missing="$missing $source"
            fi
          done < <(git ls-files 'Examples/DMActionExample/*.swift')
          if [ -n "$missing" ]; then
            echo "The build log does not show these compiled:$missing"
            exit 1
          fi
          warnings="$(grep -E "/Examples/[^:]*:[0-9]+:[0-9]+: warning:" "$RUNNER_TEMP/example.log" | sort -u || true)"
          if [ -n "$warnings" ]; then
            echo "$warnings"
            exit 1
          fi
      - name: Find unused imports
        if: matrix.newest
        run: Scripts/lint.sh --analyze "$RUNNER_TEMP/example.log"
      - name: Upload the result bundle
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-xcresult-${{ matrix.runner }}
          path: ${{ runner.temp }}/example.xcresult
          retention-days: 7

  docs:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      # A broken symbol link is a warning to DocC and an error here.
      - name: Build the documentation
        run: |
          xcodebuild docbuild \
            -scheme DMAction \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            OTHER_DOCC_FLAGS="--warnings-as-errors"

  snippets:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Compile the Swift examples of the documents and the doc comments
        run: Scripts/check-snippets.sh

  floor:
    # The oldest toolchain the manifest promises: swift-tools-version 6.0 is Xcode 16.0 to 16.2.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      # Tools/Package.swift is tools 6.0 like the package, and DMDevKit has to build with the oldest
      # compiler that the manifest promises. The other jobs run the tools on newer Xcode versions.
      - name: Build the tools with Swift 6.0
        run: swift run --quiet --package-path Tools devkit --version
      # The package has no dependency, so the flag reaches only its own library and test targets.
      - name: Build and test with Swift 6.0
        run: |
          swift --version
          swift test -Xswiftc -warnings-as-errors

  thread-sanitizer:
    # A run continues on whichever thread completes an attempt. The suite runs once more
    # under the Thread Sanitizer, on the host, where it is fastest.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Test with the Thread Sanitizer
        run: swift test --sanitize=thread

  consumer:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      # A reader of Package.resolved that never fails looks like a clean tree, so it is tried first on
      # texts that it must reject.
      - name: Self-test of the reader of Package.resolved
        run: Scripts/check-manifest.sh --self-test
      - name: Manifest, installation by version, consumer fixture, podspec, rejected shapes
        run: Scripts/check-manifest.sh

  api:
    # The interface text depends on the compiler: this job and the baseline use Xcode 26.6.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Check the normalisation of the interface
        run: Scripts/check-api.sh --self-test
      - name: Check the mapping of the digester result
        run: Scripts/check-api-digester.sh --self-test
      - name: Public interface against the baseline
        run: Scripts/check-api.sh
      # What the pull request removes, changes or adds in the baseline, for the reviewer. The
      # comparison above is the one that fails; this step fails only when it cannot compare. The
      # text is indented as a code block: a line of a fork's baseline could close a fence.
      - name: Write the interface delta against the base to the job summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          status=0
          Scripts/check-api.sh --since "$BASE_SHA" > "$RUNNER_TEMP/delta.txt" 2>&1 || status=$?
          {
            echo "### Public interface against the base of the pull request"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/delta.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0 | 3 | 4) ;;
            1)
              if ! grep -q '^Removed or changed' "$RUNNER_TEMP/delta.txt"; then
                cat "$RUNNER_TEMP/delta.txt" >&2
                exit 1
              fi
              ;;
            *)
              cat "$RUNNER_TEMP/delta.txt" >&2
              exit "$status"
              ;;
          esac
      # What swift-api-digester finds against the last release, for the reviewer. It blocks at the
      # release (Scripts/check-release.sh), not here: a break is information on a pull request, and
      # this step fails only when it cannot compare. The baseline is the newest dated heading of the
      # changelog that has a tag on origin, because a release pull request has its heading before
      # its tag. The text is indented as a code block: a line of a fork's source could close a fence.
      - name: Write what the digester finds against the last release to the job summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          baseline=""
          while IFS= read -r version; do
            listed=0
            git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null 2> "$RUNNER_TEMP/ls-remote.err" || listed=$?
            # Status 2 is a tag that origin does not have; any other status is an origin that cannot
            # be asked, and an older release must not be taken for the baseline then.
            case "$listed" in
              0)
                baseline="$version"
                break
                ;;
              2) ;;
              *)
                cat "$RUNNER_TEMP/ls-remote.err" >&2
                exit 2
                ;;
            esac
          done < <(grep -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md | sed 's/^## \[\([^]]*\)\].*$/\1/')
          if [ -z "$baseline" ]; then
            echo "No dated heading of CHANGELOG.md has a tag on origin, so there is no release to compare with." >&2
            exit 2
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/$baseline:refs/tags/$baseline"
          status=0
          Scripts/check-api-digester.sh "$baseline" > "$RUNNER_TEMP/digest.txt" 2>&1 || status=$?
          {
            echo "### Public API against $baseline, by swift-api-digester"
            echo
            sed 's/^/    /' "$RUNNER_TEMP/digest.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            0 | 1) ;;
            *)
              cat "$RUNNER_TEMP/digest.txt" >&2
              exit "$status"
              ;;
          esac

  # The pod is frozen at 1.1.0 and nothing goes to the trunk again. The job lints the current
  # sources as a pod, which builds them for watchOS too. The watchos job builds and tests the
  # package itself.
  podspec:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      # CocoaPods lints with the newest language mode the podspec lists.
      - name: Lint the podspec
        run: pod lib lint DMAction.podspec
      - name: Lint the podspec in the Swift 5 language mode
        run: pod lib lint DMAction.podspec --swift-version=5.0
