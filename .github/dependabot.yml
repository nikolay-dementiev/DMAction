# The actions of the workflows are pinned to commits. Dependabot proposes the newer ones.
# The package itself has no dependency to watch. The tools manifest in Tools/ pins DMDevKit, and
# Dependabot proposes its newer releases too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release of an action is proposed a week after it appears, not on the day it does.
    cooldown:
      default-days: 7
    # Minor and patch updates come as one pull request a week, so that a merge to main does not
    # make Dependabot rebase several at once. A major update stays a pull request of its own.
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: swift
    directory: /Tools
    schedule:
      interval: weekly
    # A release of DMDevKit is proposed a week after it appears, as for an action.
    cooldown:
      default-days: 7
    groups:
      tools:
        patterns: ["*"]
        update-types: ["minor", "patch"]
