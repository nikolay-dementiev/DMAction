# The settings of this repository for DMDevKit, schema version 1. Tools/Package.swift pins the
# DMDevKit that reads them. This file is shell code that runs with the rights of whoever runs a
# script, so review a change to it like any other code.
#
# The commands that DMDevKit runs for this repository today read SOURCE_DIR, RULES and FIXTURE_DIR.
# Seven names still duplicate the settings of a script that has not moved: MODULE, SOURCE_DIR,
# SWIFT_FLAGS, LIBRARY_EVOLUTION, DEPENDENCIES and PREPARE those of Scripts/check-api.sh, and
# FROZEN_POD_VERSION that of Scripts/check-release.sh. The part that moves those scripts deletes
# their blocks, so that every setting has one home. Until then, change both.
DEVKIT_CONF_VERSION=1
MODULE="DMAction"
SOURCE_DIR="Sources/DMAction"
RULES="domain_foundation_only domain_imports domain_no_facade_types force_unwrapping no_process_termination"
FIXTURE_DIR="Fixtures/Lint"
SWIFT_FLAGS=(-swift-version 6 -enable-upcoming-feature ExistentialAny)
LIBRARY_EVOLUTION="yes"
FROZEN_POD_VERSION="1.1.0"
DEPENDENCIES=()
PREPARE=()
