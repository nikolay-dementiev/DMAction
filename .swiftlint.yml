swiftlint_version: 0.65.1

included:
  - Sources
  - Tests
  - Examples
  - Fixtures

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - missing_docs

# Analyzer rules need the compiler invocations of a build. They run only with
# `Scripts/lint.sh --analyze <xcodebuild log>`, on the log of a build whose DerivedData is
# still on disk: the compiler invocations name their files through lists kept there.
analyzer_rules:
  - unused_import

# By default the rule lets a few calls with a literal argument be force unwrapped, such as
# URL(string: "https://example.com")!. ENGINEERING.md states no exception, so the list is empty.
force_unwrapping:
  ignored_literal_argument_functions: []

identifier_name:
  min_length: 2
  allowed_symbols: [_]

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 500
  error: 1000

function_parameter_count:
  warning: 6
  error: 10

line_length:
  warning: 130
  error: 200

# Every public symbol is documented. By default the rule skips the members of a type that
# conforms to a protocol, which is every public type of the library.
missing_docs:
  excludes_inherited_types: false

custom_rules:
  no_process_termination:
    name: "No process termination"
    # The library module, by name, like the other rules: a path that merely holds a Sources folder,
    # such as a fixture package or a second module, is not the library.
    included: ".*/Sources/DMAction/.*\\.swift"
    regex: '\b(fatalError|preconditionFailure|assertionFailure|precondition|assert|dispatchPrecondition|abort|exit)\s*\('
    match_kinds:
      - identifier
    message: "A library never terminates its host. Report the failure to the caller."
    severity: error
  # The name is older than the Domain folder: this rule covers the whole library.
  domain_imports:
    name: "Domain imports"
    # The library folder only: a path that merely contains Sources, such as the source folders of
    # the fixtures, is not the library. The pattern is matched against the absolute path, so a
    # checkout inside a folder that is itself named Sources/DMAction would apply it to everything.
    included: ".*/Sources/DMAction/.*\\.swift"
    # Any attribute, access level and import kind; a second import after a semicolon; a submodule
    # of Foundation or os is allowed. Comments and strings never match. Only spaces and tabs may
    # come before the import, so that a blank line is not swallowed and the diagnostic lands on
    # the line of the import. An import that follows a block comment on the same line is not seen.
    regex: '(?:^|;)[ \t]*(@\w+(\([^)]*\))?\s+)*((public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:struct|class|enum|protocol|typealias|func|var|let)\s+)?+(?!(?:Foundation|os)\b)\w+'
    match_kinds: [keyword, identifier, attribute.builtin, attribute.id]
    message: "The library imports Foundation and os only: no UI and no platform framework."
    severity: error
  domain_no_facade_types:
    name: "Domain names no facade type"
    # The Domain folder holds the plan as data, the layer under the facade. A path is matched as
    # domain_imports matches it, against the absolute path.
    included: ".*/Sources/DMAction/Domain/.*\\.swift"
    # The public types of the library, by their own names; a name that merely contains one is not
    # that type. Comments and strings never match. The list is kept by hand: a public type that is
    # added goes into it in the same change.
    regex: '\b(DMAction|DMButtonAction|DMActionWithFallback|DMActionResultValue|DMActionResultValueProtocol|PlaceholderCopyable)\b'
    match_kinds: [identifier, typeidentifier]
    message: "The Domain folder names no type of the facade: it is the layer under it. Use the aliases of ActionTypes.swift."
    severity: error
  domain_foundation_only:
    name: "Domain imports Foundation only"
    included: ".*/Sources/DMAction/Domain/.*\\.swift"
    # The pattern of domain_imports, with Foundation as the only module that is allowed: os belongs
    # to the Adapters folder, where the executor writes to the unified log.
    regex: '(?:^|;)[ \t]*(@\w+(\([^)]*\))?\s+)*((public|package|internal|fileprivate|private)\s+)?import\s+(?:(?:struct|class|enum|protocol|typealias|func|var|let)\s+)?+(?!Foundation\b)\w+'
    match_kinds: [keyword, identifier, attribute.builtin, attribute.id]
    message: "The Domain folder imports Foundation at most: the unified log and every other module belong to the Adapters folder or the facade."
    severity: error
