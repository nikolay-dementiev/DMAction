swiftlint_version: 0.65.1

included:
  - Sources
  - Tests
  - Examples
  - Fixtures

excluded:
  - Examples/DMActionTestProject/Pods

disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional

# Analyzer rules need the compiler invocations of a build. They run only with
# `Scripts/lint.sh --analyze <xcodebuild log>`.
analyzer_rules:
  - unused_import

identifier_name:
  min_length: 2
  allowed_symbols: [_]

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 500
  error: 1000

function_parameter_count:
  warning: 6
  error: 10

line_length:
  warning: 130
  error: 200

custom_rules:
  no_process_termination:
    name: "No process termination"
    included: "Sources/.*\\.swift"
    regex: '\b(fatalError|preconditionFailure|assertionFailure|precondition|assert|abort|exit)\s*\('
    match_kinds:
      - identifier
    message: "A library never terminates its host. Report the failure to the caller."
    severity: error
